---
- name: "Déploiement d'une instance ETL (n8n)"
  hosts: docker_hosts
  
  # All variables MUST be provided via --extra-vars (from the DataForge backend)
  vars:
    instance_name: "{{ instance_name }}"
    host_port: "{{ host_port }}"
    target_db_host: "{{ target_db_host | default('') }}"
    target_db_name: "{{ target_db_name | default('') }}"
    target_db_user: "{{ target_db_user | default('') }}"
    target_db_password: "{{ target_db_password | default('') }}"

  roles:
    - role: n8n_instance
