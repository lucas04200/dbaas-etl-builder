name: Deploy Full Stack on Push (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Infrastructure Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible
          ansible-galaxy collection install community.docker

      - name: Syntax Check des Playbooks
        run: |
          ansible-playbook --syntax-check ansible/deploy_dataforge_db.yml
          ansible-playbook --syntax-check ansible/deploy_web.yml


  deploy:
    name: Déploiement Complet sur NAS / VM Privée
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la dépendance Docker pour Ansible (Si manquante)
        run: ansible-galaxy collection install community.docker

      - name: "[Provisioning] 0. Installer les prérequis système (Ansible)"
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy_prerequisites.yml || echo "Installation des prérequis via Ansible terminée (ou ignorée sans sudo)."

      - name: "[Provisioning] 1. Générer le master key (Si absente)"
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi
          if ! grep -q "DATAFORGE_MASTER_KEY" .env; then
            export DATAFORGE_MASTER_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" 2>/dev/null || echo "")
            if [ -z "$DATAFORGE_MASTER_KEY" ]; then
                pip install -q cryptography 2>/dev/null || pip3 install -q cryptography --break-system-packages
                export DATAFORGE_MASTER_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
            fi
            echo "DATAFORGE_MASTER_KEY='$DATAFORGE_MASTER_KEY'" >> .env
            echo "Nouvelle DATAFORGE_MASTER_KEY générée dans .env"
          fi

      - name: "[Provisioning] 2. Déployer la base de données interne (Ansible)"
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy_dataforge_db.yml

      - name: "[Provisioning] 3. Attendre le démarrage de PostgreSQL"
        run: |
          MAX_RETRIES=20
          COUNT=0
          until docker exec dataforge_internal_db pg_isready -U dataforge -d dataforge -q 2>/dev/null; do
              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "x PostgreSQL n'a pas démarré dans les temps. Vérifiez le conteneur."
                  exit 1
              fi
              echo "Tentative $COUNT/$MAX_RETRIES..."
              sleep 2
          done
          echo "v PostgreSQL prêt"

      - name: "[Setup] Préparer l'environnement Node.js pour le GitHub Runner"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "[Build] 4. Build du frontend Vue"
        run: |
          cd web/frontend
          npm install -q
          npm run build

      - name: "Syntax Check du playbook de déploiement web"
        run: |
          ansible-playbook --syntax-check ansible/deploy_web.yml

      - name: "[Deploy] 5. Installer les dépendances Python"
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install -r web/requirements.txt -q

      - name: "[Deploy] 6. Déployer le serveur web et configurer le démarrage automatique (Ansible)"
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy_web.yml

